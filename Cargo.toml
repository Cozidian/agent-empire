[package]
name = "empire"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18"
crossterm = "0.29"
libc = "0.2.191"
portable-pty = "0.9.0"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
vt100 = "0.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 3

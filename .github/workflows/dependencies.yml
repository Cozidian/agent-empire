name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified cargo-deny
        run: |
          curl -qfsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz -o /tmp/cargo-deny.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' | sha256sum --check
          mkdir /tmp/cargo-deny
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny --strip-components=1
      - name: Check advisories, licenses and dependency sources
        run: /tmp/cargo-deny/cargo-deny --locked check advisories licenses sources
